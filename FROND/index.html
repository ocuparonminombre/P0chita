<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Corporativo Seguro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos para ocultar/mostrar secciones */
        #chat-section { display: none; }
        
        /* Estilos básicos para mensajes del sistema si no están en tu style.css */
        .system-message {
            text-align: center;
            font-size: 0.8rem;
            font-style: italic;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div id="login-section">
        <h2>Bienvenido al chat P0chita</h2>
        <p>logueate con google .</p>
        <button id="btn-login">Iniciar Sesión con Google</button>
    </div>

    <div id="chat-section" class="chat-container">
        <header>
            <h1>Sala General</h1>
            <div id="user-info"></div> <button id="btn-logout" style="font-size: 0.8rem;">Salir</button>
        </header>
        
        <ul id="messages"></ul>

        <form id="form" action="">
            <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
            <button>Enviar</button>
        </form>
    </div>

    <script type="module">
        // Importar funciones necesarias de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { io } from "https://cdn.socket.io/4.5.4/socket.io.esm.min.js";

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAbNqiXHeP8rPZq8N0oyNgrR-HkaZom79M",
            authDomain: "syscolabora.firebaseapp.com",
            projectId: "syscolabora",
            storageBucket: "syscolabora.firebasestorage.app",
            messagingSenderId: "101549777166",
            appId: "1:101549777166:web:db003d746e6995b3de775f",
            measurementId: "G-ZSSRT2GN13"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let socket;

        // Referencias DOM
        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const userInfo = document.getElementById('user-info');

        // 1. Botón de Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                console.log('Iniciando login con Google...');
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                console.log('Login exitoso:', user.displayName);
                
                // Obtener Token JWT
                const token = await user.getIdToken();
                console.log('Token obtenido, conectando al servidor...');
                connectSocket(token, user);
            } catch (error) {
                console.error("Error login:", error);
                alert("Error al iniciar sesión: " + error.message);
            }
        });

        // 2. Función para conectar al Websocket
        function connectSocket(token, user) {
            console.log('Intentando conectar con token:', token ? 'Token presente' : 'Sin token');
            
            // Conectamos
            socket = io('http://localhost:3000', {
                auth: { token: token },
                transports: ['websocket', 'polling']
            });
            
            socket.on('connect_error', (err) => {
                console.error('Error de conexión:', err);
                alert("Error de conexión: " + err.message + "\n\nVerifica que el servidor esté corriendo en http://localhost:3000");
            });
             
            // --- AQUÍ ELIMINÉ LOS LISTENERS DUPLICADOS --- 
            // (Ya no están 'user connected' ni 'user disconnected' aquí)

            socket.on('connect', () => {
                console.log('¡Conectado al servidor exitosamente!');
                // Cambiar interfaz
                loginSection.style.display = 'none';
                chatSection.style.display = 'block';
                userInfo.innerHTML = `<img src="${user.photoURL}" class="user-avatar"> ${user.displayName}`;
                
                // Iniciamos los listeners del chat UNA SOLA VEZ
                setupChatListeners();
            });

            socket.on('disconnect', () => {
                console.log('Desconectado del servidor');
            });
        }

        // 3. Lógica del Chat
        function setupChatListeners() {
            const form = document.getElementById('form');
            const input = document.getElementById('input');
            const messages = document.getElementById('messages');

            // Limpiar listeners anteriores para evitar dobles mensajes si se reconecta
            socket.off('chat_message');
            socket.off('user connected');
            socket.off('user disconnected');

            // Enviar mensaje
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (input.value) {
                    socket.emit('chat_message', input.value);
                    input.value = '';
                }
            });

            // Recibir mensaje de chat
            socket.on('chat_message', (data) => {
                const item = document.createElement('li');
                item.className = 'message';
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${data.avatar || 'https://via.placeholder.com/30'}" class="user-avatar" style="width:20px;height:20px;border-radius:50%;">
                        <div>
                            <strong>${data.user}</strong> <small>[${data.time}]</small>: 
                            <span>${data.text}</span>
                        </div>
                    </div>
                `;
                messages.appendChild(item);
                scrollToBottom();
            });

            // USUARIO CONECTADO (Solo este bloque controla el mensaje verde)
            socket.on('user connected', (data) => {
                const item = document.createElement('li');
                item.textContent = data.text;
                
                // Estilos directos
                item.style.color = 'green';
                item.style.fontStyle = 'italic';
                item.style.textAlign = 'center';
                item.style.listStyle = 'none';
                item.style.margin = '5px 0';

                messages.appendChild(item);
                scrollToBottom();
            });

            // USUARIO DESCONECTADO (Solo este bloque controla el mensaje rojo)
            socket.on('user disconnected', (data) => {
                const item = document.createElement('li');
                item.textContent = data.text;
                
                // Estilos directos
                item.style.color = 'red';
                item.style.fontStyle = 'italic';
                item.style.textAlign = 'center';
                item.style.listStyle = 'none';
                item.style.margin = '5px 0';

                messages.appendChild(item);
                scrollToBottom();
            });
            
            // Función auxiliar para bajar el scroll
            function scrollToBottom() {
                setTimeout(() => {
                    messages.scrollTo({
                        top: messages.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 10);
            }

            // Logout
            // Clonamos el botón para eliminar eventos anteriores y evitar multiples clicks
            const oldBtn = document.getElementById('btn-logout');
            const newBtn = oldBtn.cloneNode(true);
            oldBtn.parentNode.replaceChild(newBtn, oldBtn);

            newBtn.addEventListener('click', () => {
                signOut(auth);
                socket.disconnect();
                location.reload();
            });
        }
    </script>
</body>
</html>
