<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Corporativo Seguro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos para ocultar/mostrar secciones */
        #chat-section { display: none; }
        
        /* Estilos básicos para mensajes del sistema si no están en tu style.css */
        .system-message {
            text-align: center;
            font-size: 0.8rem;
            font-style: italic;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div id="login-section">
        <h2>Bienvenido al chat P0chita</h2>
        <p>logueate con google .</p>
        <button id="btn-login">Iniciar Sesión con Google</button>
    </div>

    <div id="chat-section" class="chat-container">
        <header>
            <h1>Sala General</h1>
            <div id="user-info"></div> <button id="btn-logout" style="font-size: 0.8rem;">Salir</button>
        </header>
        
        <ul id="messages"></ul>

        <form id="form" action="">
            <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
            <button>Enviar</button>
        </form>
    </div>

    <script type="module">
        // 1. Importaciones
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        
        // IMPORTAMOS NUESTRO NUEVO ARCHIVO DE SOCKETS
        import { conectarSocket, enviarMensaje, desconectarSocket, borrarHistorial } from './socket-service.js';

        // 2. Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAbNqiXHeP8rPZq8N0oyNgrR-HkaZom79M",
            authDomain: "syscolabora.firebaseapp.com",
            projectId: "syscolabora",
            storageBucket: "syscolabora.firebasestorage.app",
            messagingSenderId: "101549777166",
            appId: "1:101549777166:web:db003d746e6995b3de775f",
            measurementId: "G-ZSSRT2GN13"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Referencias DOM
        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const userInfo = document.getElementById('user-info');
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');

        // 3. Manejo del Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const token = await user.getIdToken();
                
                iniciarChat(token, user); // Función auxiliar abajo
            } catch (error) {
                console.error("Error login:", error);
                alert("Error: " + error.message);
            }
        });

        // 4. Función que conecta todo
        function iniciarChat(token, user) {
            // Llamamos a nuestro archivo separado pasándole "Callbacks" (Instrucciones de qué hacer con los datos)
            conectarSocket(token, {
                
                onConnect: () => {
                    console.log("Conectado!");
                    loginSection.style.display = 'none';
                    chatSection.style.display = 'block';
                    userInfo.innerHTML = `<img src="${user.photoURL}" class="user-avatar"> ${user.displayName}`;
                },

                onDisconnect: () => {
                    console.log("Desconectado");
                },

                onMessageReceived: (data) => {
                    agregarMensajeDOM(data); // Usamos función visual
                },

                onSystemMessage: (data, color) => {
                    agregarSistemaDOM(data.text, color);
                },
                
                onHistoryCleared: (data) => {
                    messages.innerHTML = '';
                    agregarSistemaDOM(data.text, 'red');
                }
            });
        }

        // 5. Eventos de botones del Chat
        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                enviarMensaje(input.value); // Usamos la función importada
                input.value = '';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
            desconectarSocket(); // Usamos la función importada
            location.reload();
        });
        
        // Si tienes el botón de borrar
        const btnClear = document.getElementById('btn-clear');
        if(btnClear) {
            btnClear.addEventListener('click', () => {
               if(confirm("¿Borrar todo?")) borrarHistorial();
            });
        }

        // --- FUNCIONES VISUALES (Solo tocan el HTML) ---
        
        function agregarMensajeDOM(data) {
            const item = document.createElement('li');
            item.className = 'message';
            item.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <img src="${data.avatar || 'https://via.placeholder.com/30'}" class="user-avatar" style="width:20px;height:20px;border-radius:50%;">
                    <div>
                        <strong>${data.user}</strong> <small>[${data.time}]</small>: 
                        <span>${data.text}</span>
                    </div>
                </div>
            `;
            messages.appendChild(item);
            bajarScroll();
        }

        function agregarSistemaDOM(texto, color) {
            const item = document.createElement('li');
            item.textContent = texto;
            item.style.color = color;
            item.style.fontStyle = 'italic';
            item.style.textAlign = 'center';
            item.style.listStyle = 'none';
            item.style.margin = '5px 0';
            messages.appendChild(item);
            bajarScroll();
        }

        function bajarScroll() {
            setTimeout(() => {
                messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
            }, 10);
        }
    </script>
</body>
</html>
