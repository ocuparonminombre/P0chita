<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Corporativo Seguro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos para ocultar/mostrar secciones */
        #chat-section { display: none; }
    </style>
</head>
<body>

    <div id="login-section">
        <h2>Bienvenido al Chat Corporativo</h2>
        <p>Por favor, identifícate para continuar.</p>
        <button id="btn-login">Iniciar Sesión con Google</button>
    </div>

    <div id="chat-section" class="chat-container">
        <header>
            <h1>Sala General</h1>
            <div id="user-info"></div> <button id="btn-logout" style="font-size: 0.8rem;">Salir</button>
        </header>
        
        <ul id="messages"></ul>

        <form id="form" action="">
            <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
            <button>Enviar</button>
        </form>
    </div>

    <script type="module">
        // Importar funciones necesarias de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { io } from "https://cdn.socket.io/4.5.4/socket.io.esm.min.js";

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAbNqiXHeP8rPZq8N0oyNgrR-HkaZom79M",
            authDomain: "syscolabora.firebaseapp.com",
            projectId: "syscolabora",
            storageBucket: "syscolabora.firebasestorage.app",
            messagingSenderId: "101549777166",
            appId: "1:101549777166:web:db003d746e6995b3de775f",
            measurementId: "G-ZSSRT2GN13"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let socket;

        // Referencias DOM
        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const userInfo = document.getElementById('user-info');

        // 1. Manejo del botón de Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                console.log('Iniciando login con Google...');
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                console.log('Login exitoso:', user.displayName);
                
                // ¡IMPORTANTE! Obtener el Token JWT para enviarlo al servidor
                const token = await user.getIdToken();
                console.log('Token obtenido, conectando al servidor...');
                connectSocket(token, user);
            } catch (error) {
                console.error("Error login:", error);
                alert("Error al iniciar sesión: " + error.message);
            }
        });

        // 2. Función para conectar al Websocket tras login exitoso
        function connectSocket(token, user) {
            console.log('Intentando conectar con token:', token ? 'Token presente' : 'Sin token');
            
            // Conectamos enviando el token en 'auth'
            socket = io('http://localhost:3000', {
                auth: { token: token },
                transports: ['websocket', 'polling']
            });

            socket.on('connect_error', (err) => {
                console.error('Error de conexión:', err);
                alert("Error de conexión: " + err.message + "\n\nVerifica que el servidor esté corriendo en http://localhost:3000");
            });

            socket.on('connect', () => {
                console.log('¡Conectado al servidor exitosamente!');
                // Cambiar interfaz
                loginSection.style.display = 'none';
                chatSection.style.display = 'block';
                userInfo.innerHTML = `<img src="${user.photoURL}" class="user-avatar"> ${user.displayName}`;
                setupChatListeners();
            });

            socket.on('disconnect', () => {
                console.log('Desconectado del servidor');
            });
        }

        // 3. Lógica del Chat (Igual que antes)
        function setupChatListeners() {
            const form = document.getElementById('form');
            const input = document.getElementById('input');
            const messages = document.getElementById('messages');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (input.value) {
                    socket.emit('chat_message', input.value);
                    input.value = '';
                }
            });

            socket.on('chat_message', (data) => {
                const item = document.createElement('li');
                item.className = 'message';
                item.innerHTML = `
                    <img src="${data.avatar || 'https://via.placeholder.com/30'}" class="user-avatar" style="width:20px;height:20px;">
                    <strong>${data.user}</strong> <small>[${data.time}]</small>: ${data.text}
                `;
                messages.appendChild(item);
                // Scroll suave al final
                setTimeout(() => {
                    messages.scrollTo({
                        top: messages.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 10);
            });

            // Escuchar eventos de conexión/desconexión de usuarios
            socket.on('user connected', (data) => {
                const item = document.createElement('li');
                item.className = 'system-message';
                item.textContent = data.text;
                messages.appendChild(item);
                setTimeout(() => {
                    messages.scrollTo({
                        top: messages.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 10);
            });

            socket.on('user disconnected', (data) => {
                const item = document.createElement('li');
                item.className = 'system-message';
                item.textContent = data.text;
                messages.appendChild(item);
                setTimeout(() => {
                    messages.scrollTo({
                        top: messages.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 10);
            });
            
            // Logout
            document.getElementById('btn-logout').addEventListener('click', () => {
                signOut(auth);
                socket.disconnect();
                location.reload();
            });
        }
    </script>
</body>
</html>
